; ─────────────────────────────────────────────────────────────
; Call Me Maybe — dialplan
;
; This file stays this small forever. Every decision about who gets
; connected lives in the doorman app, not here.
; ─────────────────────────────────────────────────────────────

[globals]
DOORMAN_APP=doorman

[inbound-trunk]
; ── A second number? ─────────────────────────────────────────
; One registration carries every DID you buy, so extra numbers arrive here
; too. Send one to its own line by matching it exactly — an exact match wins
; over the _X. pattern below — and doorman answers it from policy.<line>.toml
; instead of policy.toml. Uncomment and use YOUR DID, in the digit format the
; provider actually sends (watch the NoOp below in `asterisk -rvvv`; VoIP.ms
; sends 10 digits, others send 11 or +E.164):
;
;exten => 5125550142,1,Goto(from-trunk-biz,${EXTEN},1)
;
; No line named, no change: everything else falls through to the default
; line, which is plain policy.toml and exactly what this file has always
; done. See RUNBOOK "Add a second number".

; Everything arriving on the VoIP.ms trunk goes straight to the lobby.
exten => _X.,1,NoOp(Inbound from ${CALLERID(num)} to ${EXTEN})
 same => n,Set(CHANNEL(hangup_handler_push)=cmm-hangup,s,1)
 ; Answer here rather than in ARI so the audio path is already up when
 ; the greeting starts — this is what makes the lobby feel instant.
 same => n,Answer()
 same => n,Stasis(${DOORMAN_APP})
 same => n,Hangup()

; One context per extra line. The third Stasis argument is the line name and
; it must match a policy.<name>.toml sitting beside policy.toml — doorman
; cannot read this file, so a name with no policy file falls back to the
; default line and logs loudly rather than dropping the call.
;
;[from-trunk-biz]
;exten => _X.,1,NoOp(Inbound from ${CALLERID(num)} to ${EXTEN} on line biz)
; same => n,Set(CHANNEL(hangup_handler_push)=cmm-hangup,s,1)
; same => n,Answer()
; same => n,Stasis(${DOORMAN_APP},line,biz)
; same => n,Hangup()

; ── More than one PROVIDER? ──────────────────────────────────
; Everything above assumes one registration, so one [inbound-trunk] is where
; every call arrives. With several providers each registration binds to its
; own endpoint with its own context=, so there is one inbound context per
; trunk and one route per DID inside it — which grows as providers × numbers
; and is entirely mechanical.
;
; Declare the providers in trunks.toml, give each line a [line] trunk and
; [line] number, and `doorman render` writes all of it: one context per trunk,
; each DID matched in every digit format a provider might send, and one
; context per line carrying the Stasis call. Then DELETE [inbound-trunk] and
; the per-line contexts above, point the endpoints at the generated contexts,
; and uncomment:
;
;#include "extensions_trunks.conf"
;
; Deliberately commented. Asterisk refuses to start on a missing #include, so
; an unconditional one here would break every install that does not use
; trunks.toml — which is every install today. See RUNBOOK "Add a second
; provider".

; Fallback if doorman is down: ring the house directly rather than
; dropping calls on the floor. Adjust to taste.
[inbound-fallback]
exten => _X.,1,NoOp(doorman unavailable, direct ring)
 ; Local/100 reuses the generated ring-all: no handset list to keep in sync.
 same => n,Dial(Local/100@internal,30)
 same => n,Hangup()

; Per-handset material (1xx numbers, BLF hints, ring-all 100, page-all 500)
; is GENERATED from handsets.toml — run `doorman render`, copy the outputs
; to /etc/asterisk/, reload. Asterisk refuses to load until the file exists,
; which is intentional: it cannot silently run with half a phone plant.
#include "extensions_handsets.conf"

[internal]
; Handset-originated calls land here. Everything included below is also a
; valid transfer target, because transfer targets resolve in this context.
include => handsets-internal
include => features-internal
include => parkedcalls

; ── Outbound via the trunk ───────────────────────────────────
; NANP only; adjust for your dialling habits.
;
; OUTBOUND_CID is the line this phone calls as. `doorman render` writes one
; set_var=OUTBOUND_CID= per handset into pjsip_handsets.conf, from [line]
; outbound_cid and [line] outbound_handsets across every policy file, so a
; phone no line claims presents the PRIMARY line — plain policy.toml, the
; same file that carries 911. Dial *4 to choose a different one for one call;
; that sets the same variable on the channel and lands in [outbound-console].
;
; Empty is the whole of the old behaviour: no caller ID is set and the trunk
; sends whatever it sends. This path never touches doorman, which is the
; point — a crashed daemon must not stop you MAKING calls any more than it
; stops you receiving them, exactly as [inbound-fallback] does inbound.
exten => _1NXXNXXXXXX,1,ExecIf($["${OUTBOUND_CID}" != ""]?Set(CALLERID(num)=${OUTBOUND_CID}))
 same => n,Dial(PJSIP/${EXTEN}@voipms,60)
exten => _NXXNXXXXXX,1,ExecIf($["${OUTBOUND_CID}" != ""]?Set(CALLERID(num)=${OUTBOUND_CID}))
 same => n,Dial(PJSIP/1${EXTEN}@voipms,60)

; 911 deliberately sets NO caller ID and must stay that way. E911 is
; registered per DID against a street address, so an emergency call has to
; leave as the trunk's own number — not as a business line whose registered
; address is somebody else's house. Do not add OUTBOUND_CID here.
exten => _911,1,Dial(PJSIP/911@voipms,60)

[features-internal]
; ── Paging / intercom ────────────────────────────────────────
; Dial-500 page-all is generated into extensions_handsets.conf from the
; `page = true` handsets. Requires "Allow Auto Answer by Call-Info/
; Alert-Info" ON in each Grandstream's account settings — see RUNBOOK.

; ── Family conference room ───────────────────────────────────
; Any handset dials 600 and lands in the same bridge. Outside callers can
; be given a lobby PIN that targets a Local/600 pseudo-handset — see the
; commented example in examples/policy.example.toml.
exten => 600,1,Answer()
 same => n,ConfBridge(family)

; ── Home Assistant Assist (optional) ─────────────────────────
; Dial 555 to talk to HA's Assist pipeline via its native VoIP integration.
; Needs the [homeassistant] endpoint in pjsip.conf and the Opus codec —
; see RUNBOOK before uncommenting.
;exten => 555,1,Dial(PJSIP/homeassistant,20)

; ── Outbound console ─────────────────────────────────────────
; Dial *4 and doorman reads out the numbers this box can call as, takes a
; digit, takes the number you want (# to finish, or just stop dialling), and
; places the call. Only interesting once there is more than one line: with
; one number the menu has one entry, and nobody in the house ever needs it.
;
; It is enhancement, never dependency. With doorman down, Stasis fails and
; this hangs up — and every handset can still dial out normally, presenting
; whatever `doorman render` last baked into pjsip_handsets.conf.
;
; The console REFUSES 911 and always will. See [outbound-console] below.
exten => *4,1,NoOp(Outbound console)
 same => n,Answer()
 same => n,Stasis(${DOORMAN_APP},console)
 same => n,Hangup()

; ── Voicemail ────────────────────────────────────────────────
; Check messages from any handset. Prompts for mailbox + password.
exten => *97,1,Answer()
 same => n,VoiceMailMain(@household)

; ── Diagnostics ──────────────────────────────────────────────
; 9196 echoes your own audio back: a ten-second one-way-audio/RTP test.
exten => 9196,1,Answer()
 same => n,Echo()
; 9197 speaks the time: proves prompts + audio path without a second person.
exten => 9197,1,Answer()
 same => n,SayUnixTime(,,IMp)
 same => n,Hangup()

[page-autoanswer]
; Pre-dial handler for Page: the Alert-Info header is what makes the
; Grandstreams auto-answer on speaker instead of ringing.
exten => s,1,Set(PJSIP_HEADER(add,Alert-Info)=<sip:localhost>\;info=alert-autoanswer)
 same => n,Return()

[outbound-console]
; doorman releases a *4 caller here (ARI continue) with OUTBOUND_CID set to
; the line they picked and the extension set to the number they dialled.
;
; This is deliberately NOT [internal], and the difference is one line: there
; is no _911 here. doorman refuses to dial an emergency number from the
; console, and this context could not carry one if it tried — two independent
; things have to be wrong before an emergency call leaves by a line whose
; registered address is not this house. _911 in [internal] is untouched and
; remains the correct route from every handset.
;
; The dial strings are otherwise identical to [internal]'s, on purpose: the
; console is a way of reaching the ordinary outbound path with a different
; caller ID, not a second implementation of it.
exten => _1NXXNXXXXXX,1,ExecIf($["${OUTBOUND_CID}" != ""]?Set(CALLERID(num)=${OUTBOUND_CID}))
 same => n,Dial(PJSIP/${EXTEN}@voipms,60)
 same => n,Hangup()
exten => _NXXNXXXXXX,1,ExecIf($["${OUTBOUND_CID}" != ""]?Set(CALLERID(num)=${OUTBOUND_CID}))
 same => n,Dial(PJSIP/1${EXTEN}@voipms,60)
 same => n,Hangup()
; Anything this context cannot dial. doorman bounds the length and refuses
; emergency numbers, but it deliberately knows nothing about what a trunk can
; reach — that is this file's business.
exten => i,1,Playback(pbx-invalid)
 same => n,Hangup()

[voicemail-drop]
; doorman releases unanswered/afterhours callers here (ARI continue) with
; MAILBOX set. The u option plays the "unavailable" greeting.
exten => s,1,NoOp(Voicemail drop: mailbox ${MAILBOX})
 same => n,VoiceMail(${MAILBOX}@household,u)
 same => n,Hangup()

[cmm-hangup]
exten => s,1,NoOp(Call ended: ${CALLERID(num)} cause=${HANGUPCAUSE})
 same => n,Return()
