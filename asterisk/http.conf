; ARI rides on Asterisk's built-in HTTP server.
; Bound to loopback only — doorman runs on the same Pi, so there is no
; reason for this port to be reachable from the LAN, let alone the WAN.

[general]
enabled = yes
bindaddr = 127.0.0.1
bindport = 8088
; Leave TLS off for a loopback bind; turn it on if you ever move doorman
; to another host (and then put it on the tailnet, not the LAN).
tlsenable = no
