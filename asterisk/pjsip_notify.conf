; Call Me Maybe — NOTIFY types `doorman provision notify` sends.
;
; A phone that receives Event: check-sync fetches its configuration again
; from its config server (Grandstream, Yealink, Snom and Fanvil all honour
; it; Cisco SPA and Polycom use their own event names, below). It is what
; lets a password rotation end with every phone re-registered and nobody
; walking to a phone.
;
; Install beside the other Asterisk files; reload with
;   sudo asterisk -rx 'module reload res_pjsip_notify.so'
; and send one by hand with
;   sudo asterisk -rx 'pjsip send notify check-sync endpoint kitchen'

[check-sync]
Event=>check-sync

; Same event, reboot after applying — for a phone that will not pick up a
; changed account without one.
[check-sync-reboot]
Event=>check-sync;reboot=true

[polycom-check-cfg]
Event=>check-sync

[cisco-check-cfg]
Event=>check-sync

[sipura-check-cfg]
Event=>resync

[sipura-reboot]
Event=>reboot

[clear-mwi]
Event=>message-summary
Content-type=>application/simple-message-summary
Content=>Messages-Waiting: no
Content=>Message-Account: sip:asterisk@127.0.0.1
Content=>Voice-Message: 0/0 (0/0)
Content=>
