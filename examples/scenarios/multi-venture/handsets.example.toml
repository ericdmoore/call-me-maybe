# ─────────────────────────────────────────────────────────────
# Example · The multi-venture operator — the hardware.
#
# Companion to policy.example.toml, policy.example.surveying.toml,
# policy.example.bakery.toml and trunks.example.toml in this directory.
# Copy all five:
#
#   cp examples/scenarios/multi-venture/handsets.example.toml         handsets.toml
#   cp examples/scenarios/multi-venture/trunks.example.toml           trunks.toml
#   cp examples/scenarios/multi-venture/policy.example.toml           policy.toml
#   cp examples/scenarios/multi-venture/policy.example.surveying.toml policy.surveying.toml
#   cp examples/scenarios/multi-venture/policy.example.bakery.toml    policy.bakery.toml
#   ./bin/doorman init                                # the home line's PINs
#   ./bin/doorman rotate -policy policy.surveying.toml
#   ./bin/doorman rotate -policy policy.bakery.toml
#
# One phone plant, three numbers. A phone is a fact about the house and is
# written once, here; which number it presents when somebody dials out is
# `outbound_handsets` in the line that claims it, and a line claims the
# phone in its workspace: the office for the surveying business, the
# counter for the bakery. Every other phone is the house.
#
# Every handset needs dtmf_mode=rfc4733, which `doorman render` writes for
# you. Without it the lobby is deaf and every stranger is dismissed.
# ─────────────────────────────────────────────────────────────

[[handsets]]
id = "kitchen"
label = "Kitchen"
endpoint = "PJSIP/kitchen"       # must be PJSIP/<id>; render enforces it
number = 101                     # internal extension + BLF hint (100-199)
page = true
mailbox = "family"               # MWI lamp follows this voicemail.conf box
password_env = "HANDSET_KITCHEN_PASSWORD"

# The surveying business's phone. No paging into a client call; the lamp
# follows the business mailbox.
[[handsets]]
id = "office"
label = "Office"
endpoint = "PJSIP/office"
number = 102
page = false
mailbox = "surveying"
password_env = "HANDSET_OFFICE_PASSWORD"

# The bakery's phone, on the counter in the converted garage. Same rule.
[[handsets]]
id = "counter"
label = "Bakery counter"
endpoint = "PJSIP/counter"
number = 103
page = false
mailbox = "bakery"
password_env = "HANDSET_COUNTER_PASSWORD"

[[handsets]]
id = "primary-bed"
label = "Primary bedroom"
endpoint = "PJSIP/primary-bed"
number = 104
page = false
mailbox = "family"
password_env = "HANDSET_PRIMARY_BED_PASSWORD"

[[handsets]]
id = "bunk-room"
label = "Bunk room"
endpoint = "PJSIP/bunk-room"
number = 105
page = false
mailbox = "kids"
password_env = "HANDSET_BUNK_ROOM_PASSWORD"

# ── Groups ───────────────────────────────────────────────────
# A group id works anywhere a handset id does, in any of the policy files.

[[groups]]
id = "adults"
label = "Adult handsets"
handsets = ["kitchen", "office", "counter", "primary-bed"]

[[groups]]
id = "everyone"
label = "Every phone in the house"
handsets = ["kitchen", "office", "counter", "primary-bed", "bunk-room"]
