<!--
  Call Me Maybe — mark 03, "Two Doors".
  The product's actual thesis as a mark: one door open with light behind it, one
  shut. Symmetric frame, asymmetric contents — the frame satisfies Deco, the
  contents carry the meaning. Reads as a decision rather than a person.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 92" width="124" height="92"
     fill="none" stroke="currentColor" role="img"
     aria-label="Two stepped doorways, one open to light and one closed">
  <defs>
    <clipPath id="cmm-door-left">
      <path d="M14 84 V34 h5 V26 h9 V22 h12 v62 Z"/>
    </clipPath>
  </defs>

  <!-- Left: welcomed. Rays behind the opening. -->
  <g clip-path="url(#cmm-door-left)">
    <g stroke-width="2.4" opacity="0.45">
      <path d="M34 84 V16"/>
      <path d="M34 84 L24 20"/>
      <path d="M34 84 L44 20"/>
      <path d="M34 84 L16 32"/>
      <path d="M34 84 L52 32"/>
    </g>
  </g>
  <path d="M14 84 V34 h5 V26 h9 V22 h12 v62" stroke-width="2"/>

  <!-- Centre pier: fluted, and the only thing shared by both outcomes -->
  <rect x="52" y="18" width="20" height="66" fill="currentColor" fill-opacity="0.16"/>
  <rect x="52" y="18" width="20" height="66" stroke-width="2"/>
  <g stroke-width="1" opacity="0.5">
    <path d="M57 80 V24"/><path d="M62 80 V22"/><path d="M67 80 V24"/>
  </g>
  <!-- Cap on the pier -->
  <path d="M48 18 h28 v-4 h-6 v-4 H54 v4 h-6 Z" fill="currentColor" stroke="none"/>

  <!-- Right: dismissed. Same opening, barred. -->
  <path d="M110 84 V34 h-5 V26 h-9 V22 H84 v62" stroke-width="2"/>
  <g stroke-width="2.6" opacity="0.75">
    <path d="M86 40 H108"/>
    <path d="M86 54 H108"/>
    <path d="M86 68 H108"/>
  </g>

  <!-- Shared threshold -->
  <g fill="currentColor" stroke="none">
    <rect x="8" y="84" width="108" height="4"/>
    <rect x="2" y="88" width="120" height="4" fill-opacity="0.55"/>
  </g>
</svg>
