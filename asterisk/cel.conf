; Optional system-wide observation. Install with cel_sqlite3_custom.conf and
; initialise the private spool using scripts/cel-spool.sql BEFORE loading CEL.
[general]
enable=yes
; Track application names only, never their arguments.
apps=Dial,Stasis,VoiceMail
events=CHAN_START,CHAN_END,ANSWER,HANGUP,BRIDGE_ENTER,BRIDGE_EXIT,APP_START,BLINDTRANSFER,ATTENDEDTRANSFER,LINKEDID_END
; Leave dateformat unset: Doorman requires epoch seconds.microseconds.
