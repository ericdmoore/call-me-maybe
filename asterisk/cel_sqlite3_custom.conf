; The Asterisk 20/22 sqlite3 custom CEL backend writes AST_LOG_DIR/master.db.
; Pre-create the table/identity/retention trigger with scripts/cel-spool.sql.
; Deliberately exclude appdata, exten, userfield, eventextra and channel names.
; Only a complete NANP destination or 911 can enter destination; no PINs,
; partial console input, voicemail passwords, or application arguments.
[master]
table => doorman_cel
columns => eventtype,eventtime,uniqueid,linkedid,context,caller,destination,app
values => '${eventtype}','${eventtime}','${CHANNEL(uniqueid)}','${CHANNEL(linkedid)}','${CHANNEL(context)}','${CALLERID(num)}','${IF(${REGEX("^(1?[2-9][0-9][0-9][2-9][0-9][0-9][0-9][0-9][0-9][0-9]|911)$" ${CHANNEL(exten)})}?${CHANNEL(exten)}:)}','${CHANNEL(appname)}'
busy_timeout => 1000
