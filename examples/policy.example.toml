# ─────────────────────────────────────────────────────────────
# Call Me Maybe — the rules: who gets in, what rings, and when.
#   cp policy.example.toml policy.toml
#   ./bin/doorman check
#
# Hardware lives in handsets.toml; secrets live in .env. This file is the
# one that changes weekly, and it is safe to edit at 9pm: a file that fails
# validation is rejected on reload and the previous good policy stays in
# service. Handset and group ids referenced here must exist in handsets.toml.
# ─────────────────────────────────────────────────────────────

# ── Line identity ────────────────────────────────────────────
# Optional, and every key in it is optional: leave the whole section out and
# this file behaves exactly as it did before the section existed.
#
# It earns its keep on a box answering more than one number, where each extra
# number gets its own policy.<line>.toml. `on_no_input` is the interesting
# one — it is the difference between a curt doorman and a courteous
# concierge running on the same binary.
#
# [line]
# label       = "Mertaugh Enterprises"  # shown by `doorman check`, and on the
#                                       # handset when a caller reaches the
#                                       # house without dialling anything
# number      = "+15125550142"          # identity only; nothing routes on it
# prompts     = "concierge"             # this line's prompt pack, overriding
#                                       # PROMPT_MEDIA_PREFIX
# on_no_input = "voicemail"             # what a caller who dials nothing gets:
#                                       #   dismiss     (default) "good day"
#                                       #   voicemail   the [house] mailbox
#                                       #   ring-house  the house rings
# trunk       = "voipms"                # ONLY with a trunks.toml: which
#                                       # provider this number arrives on. With
#                                       # one provider leave it out — the
#                                       # hand-written pjsip.conf is the answer
#
# "voicemail" needs a [house] voicemail to land in. "ring-house" means anyone
# patient enough to say nothing reaches the house, so the allow-list becomes a
# shortcut past the lobby rather than a gate — a real choice, worth making
# deliberately. Somebody on the allow-list is never dismissed by this setting.
#
# ── Outbound identity ────────────────────────────────────────
# What the person you ring back sees. Leave it out and outbound calls present
# whatever the trunk sends, which is what they have always done.
#
# outbound_cid      = "+15125550142"  # what a call placed as this line shows
# outbound_handsets = ["office"]      # phones that call as it without asking
#
# This file — plain policy.toml, with no line name in it — is the PRIMARY
# line, and its outbound_cid is the house default: any handset no line claims
# presents it. That is the same file 911 leaves by, deliberately, so there is
# one answer to "which line am I on when I have not said" rather than two that
# can disagree.
#
# Dial *4 from any handset to choose a different line for one call. It reads
# the numbers out, takes the one you want, and places the call — and it
# refuses 911, because an emergency call has to leave by the trunk whose
# street address is registered. Dial 911 directly; that path is untouched.
#
# outbound_handsets is written HERE rather than in handsets.toml because that
# file is one shared inventory and cannot say something true of only one line.
# Two lines claiming the same phone is an error `doorman check` reports.
#
# Changing outbound_cid reaches *4 on the next reload and the plain dial path
# on the next `doorman render` — it is baked into the generated PJSIP config,
# because a handset that just picks up and dials never reaches doorman at all.
#
# With a trunks.toml, outbound_cid travels with [line] trunk as one decision:
# the call leaves by that provider, because a provider will not present a
# number its account does not own — it rejects the call or silently rewrites
# the caller ID, and neither is visible from this end. `doorman check` refuses
# an outbound_cid this config declares at a different provider. Without a
# trunks.toml there is one trunk, nothing to choose, and nothing changes.

# What rings when a known caller is welcomed.
[house]
handsets = ["kitchen", "living-room", "office", "primary-bed"]
# When nobody answers, the caller lands in this mailbox (voicemail.conf's
# [household] section) instead of being dismissed. Remove to disable.
voicemail = "family"
# Shown on the handset display. {name} is the extension/group label for
# internal routing; {number} is the normalised caller.
caller_id_format = "Lobby: {name} <{number}>"

# ── The allow-list ───────────────────────────────────────────
# These callers hear "Welcome, I'll connect you" and ring the whole house.
# Numbers may be written any way you like — 512-555-0100, (512) 555-0100,
# +15125550100 — they are normalised to E.164 at load time. Anything that
# is not a real number is a load error, not a silent never-match.

[[people]]
name = "Grandma"
numbers = ["512-555-0100"]

[[people]]
name = "Eric"
numbers = ["+15125550101", "512-555-0102"]
notes = "mobile + work line"

[[people]]
name = "School front office"
numbers = ["(512) 555-0150"]
notes = "attendance line — do not remove"

# ── Schedules ────────────────────────────────────────────────
# Named time windows, defined once and referenced by id from extensions.
# Turning bedtime off for spring break is one `enabled = false` here — no
# hunting through extensions. A window that crosses midnight belongs to the
# day it STARTS: this one covers Sunday night through Monday 07:00, and
# Friday/Saturday nights stay open.

[[schedules]]
id = "school-night"
enabled = true
start = "20:30"
end = "07:00"
days = ["SU", "MO", "TU", "WE", "TH"]

# ── Extensions ───────────────────────────────────────────────
# Unknown callers dial one of these in the lobby. The PIN *is* the
# extension, so treat it like a password.
#
# Every PIN below is the CHANGEME sentinel, and that is deliberate: it is not
# a weak PIN, it is an impossible one. The lobby only ever collects keypad
# digits and compares them by exact match, so a non-digit PIN cannot be
# entered by any sequence of keypresses. `doorman check` refuses to load this
# file until they are replaced, which is the whole point — a placeholder that
# merely *looks* wrong (4242) works silently forever.
#
# Replace them all at once:
#
#   doorman init

[[extensions]]
pin = "CHANGEME"
label = "Kitchen"
handsets = ["kitchen"]

[[extensions]]
pin = "CHANGEME"
label = "Office"
handsets = ["office"]

[[extensions]]
pin = "CHANGEME"
label = "Whole house"
handsets = ["kitchen", "living-room", "office", "primary-bed"]
voicemail = "family"

# ── A ringer ladder with quiet hours ─────────────────────────
# Callers who dial the kids' extension ring the kids' room for 3 ring
# cycles (~6s each), escalate to the adult handsets for 4 more, then land
# in the kids mailbox. On school nights the line doesn't ring at all —
# straight to voicemail between 20:30 and 07:00. Flip `enabled` under
# [extensions.afterhours] to false for holidays.

[[extensions]]
pin = "CHANGEME"
label = "Kids"
voicemail = "kids"
afterhours = "school-night"

  [[extensions.steps]]
  handsets = ["kids-room"]
  rings = 3

  [[extensions.steps]]
  handsets = ["adults"]     # group
  rings = 4                 # or `seconds = 24` for an exact duration


# ── An outside line into the family conference ───────────────
# Local channels let a "handset" be any dialplan destination: this PIN drops
# a caller straight into the ConfBridge at 600. Uncomment to use.
#[[extensions]]
#pin = "CHANGEME"          # like every PIN here: doorman init, or pick your own
#label = "Conference"
#handsets = ["conference"]
# (the "conference" pseudo-handset ships in handsets.example.toml)
