; Call parking: transfer a live call to 700, Asterisk announces a slot
; (701-720), anyone dials that slot from any handset to pick the call up.
; After the timeout the call rings back to whoever parked it.

[general]
parkeddynamic = no

[default]
parkext => 700
parkpos => 701-720
context => parkedcalls
parkingtime => 120
comebacktoorigin => yes
findslot => next
